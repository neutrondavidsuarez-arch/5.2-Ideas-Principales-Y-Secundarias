    <script>
        const DRIVE_PDF_URL = "https://drive.google.com/file/d/1tPdsfPZVt-oOM-a1YmCbr8oMPMprzbl2/view?usp=sharing";
        const DRIVE_VIDEO_URL = "https://drive.google.com/file/d/1GdrzGCZvmDtz_sHZogW4ijLBEXfeOyCk/view?usp=sharing";

        // PRINCIPAL (Deber + Repaso) – 50 preguntas
        const quizData = [
            { question: 'Ideas principales y secundarias <br> Indique si los siguientes enunciados son Verdaderos (V) o Falsos (F) según el texto: <br> 1) La idea principal puede suprimirse sin que el texto pierda sentido. <br> 2) Las ideas secundarias aportan ejemplos y detalles. <br> 3) La idea principal siempre está explícita. <br> 4) Las ideas secundarias dependen de la idea principal.', options: ['V-V-V-V', 'F-V-F-V', 'V-F-V-F', 'F-V-F-F'], answer: 'F-V-F-V', explanation: 'B) F-V-F-V <br> F – La idea principal no puede suprimirse; si se elimina, el texto pierde su sentido central. <br> V – Las ideas secundarias aportan ejemplos, detalles, datos y explicaciones. <br> F – La idea principal no siempre está explícita; a veces es implícita y debe inferirse. <br> V – Las ideas secundarias dependen de la principal y la desarrollan o apoyan.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ideas principales <br> Complete la analogía: <br> Idea principal es a esencia como idea secundaria es a ________.', options: ['fundamental', 'complemento', 'eliminable', 'central'], answer: 'complemento', explanation: 'B) complemento <br> La idea principal es la esencia del texto; la secundaria es su complemento (detalles, ejemplos, etc.).', multi: 'OFF', maxSelect: 1 },
            { question: 'Características de las ideas principales <br> ¿Cuál NO es una característica de la idea principal?', options: ['Expresa el punto central del tema.', 'No depende de otras ideas.', 'Incluye detalles y ejemplos.', 'Si se elimina, el texto pierde sentido.'], answer: 'Incluye detalles y ejemplos.', explanation: 'C) Incluye detalles y ejemplos. <br> Las características de la idea principal son: expresa el punto central, no depende de otras ideas y, si se elimina, el texto pierde sentido. Los detalles y ejemplos son propios de las ideas secundarias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Organizadores gráficos <br> Complete el texto: <br> "Los organizadores gráficos son herramientas ________ que permiten ________ la información y visualizar ________ entre conceptos."', options: ['auditivas – memorizar – diferencias', 'visuales – estructurar – relaciones', 'textuales – copiar – jerarquías', 'digitales – eliminar – conexiones'], answer: 'visuales – estructurar – relaciones', explanation: 'B) visuales – estructurar – relaciones <br> Los organizadores gráficos son herramientas visuales que permiten estructurar la información y visualizar relaciones entre conceptos.', multi: 'OFF', maxSelect: 1 },
            { question: 'Relacione cada organizador gráfico con su función principal: <br> Organizador <br> <br> 1. Diagrama de Venn <br> 2. Línea de tiempo <br> 3. Mapa conceptual <br> 4. Diagrama de causa-efecto <br> <br> Función <br> a) Ordenar eventos cronológicamente <br> b) Mostrar similitudes y diferencias <br> c) Identificar causas de un problema <br> d) Jerarquizar conceptos', options: ['1b 2a 3d 4c', '1a 2b 3c 4d', '1d 2c 3b 4a', '1c 2d 3a 4b'], answer: '1b 2a 3d 4c', explanation: 'A) 1b – 2a – 3d – 4c <br> 1. Diagrama de Venn → mostrar similitudes y diferencias. <br> 2. Línea de tiempo → ordenar eventos cronológicamente. <br> 3. Mapa conceptual → jerarquizar conceptos. <br> 4. Diagrama de causa-efecto → identificar causas de un problema.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordene los pasos para interpretar una tabla: <br> 1) Identificar ejes y variables <br> 2) Leer el título <br> 3) Comparar datos y buscar tendencias <br> 4) Revisar leyendas y notas', options: ['2-1-4-3', '1-2-3-4', '4-3-2-1', '2-4-1-3'], answer: '2-4-1-3', explanation: 'D) 2-4-1-3 <br> Orden lógico: leer el título → revisar leyendas y notas → identificar ejes y variables → comparar datos y buscar tendencias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: <br> “La Revolución Industrial no solo transformó la economía, sino también la estructura social. Surgieron nuevas clases, como el proletariado, y se aceleró el crecimiento urbano.” <br> ¿Cuál es la idea principal?', options: ['Surgió el proletariado.', 'Crecimiento urbano acelerado.', 'Transformación económica y social por la Revolución Industrial.', 'La economía cambió.'], answer: 'Transformación económica y social por la Revolución Industrial.', explanation: 'C) Transformación económica y social por la Revolución Industrial. <br> Es la idea que resume el párrafo completo. A y B son detalles secundarios; D es incompleta.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: “El uracilo hallado en el asteroide Ryugu sugiere que compuestos extraterrestres influyeron en el origen de la vida en la Tierra.” <br> ¿Qué idea secundaria se menciona?', options: ['El uracilo es un componente del ARN.', 'La sonda tomó muestras del asteroide.', 'Los asteroides contienen aminoácidos.', 'El origen de la vida es exclusivo de la Tierra.'], answer: 'El uracilo es un componente del ARN.', explanation: 'A) El uracilo es un componente del ARN. <br> El texto menciona el hallazgo de uracilo y su posible influencia en el origen de la vida. La opción A es la idea secundaria más coherente con el contexto científico. Las demás no aparecen o son incorrectas.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál es el organizador gráfico más adecuado para comparar dos teorías sociológicas?', options: ['Línea de tiempo', 'Diagrama de Venn', 'Mapa mental', 'Gráfico de barras'], answer: 'Diagrama de Venn', explanation: 'B) Diagrama de Venn <br> Es el más adecuado para comparar similitudes y diferencias entre dos teorías.', multi: 'OFF', maxSelect: 1 },
            { question: 'Seleccione dos características de las ideas principales: <br> 1) Son eliminables sin afectar el sentido global. <br> 2) Expresan el mensaje central. <br> 3) Dependen de las ideas secundarias. <br> 4) Articulan y dan coherencia al texto.', options: ['1 y 2', '2 y 3', '3 y 4', '2 y 4'], answer: '2 y 4', explanation: 'D) 2 y 4 <br> Características de las ideas principales: expresan el mensaje central y articulan/dan coherencia al texto. No son eliminables ni dependen de las secundarias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Seleccione tres estrategias para identificar ideas principales: <br> 1) Preguntarse: “¿De qué trata el texto?” <br> 2) Buscar oraciones temáticas al inicio o final. <br> 3) Subrayar todos los adjetivos. <br> 4) Eliminar todas las ideas secundarias. <br> 5) Usar la abstracción para reducir el texto a su esencia. <br> 6) Contar el número de párrafos.', options: ['1, 2, 5', '2, 3, 6', '3, 4, 5', '1, 4, 6'], answer: '1, 2, 5', explanation: 'A) 1, 2, 5 <br> Estrategias válidas: preguntarse de qué trata el texto, buscar oraciones temáticas y usar la abstracción. Subrayar adjetivos o contar párrafos no son estrategias útiles.', multi: 'OFF', maxSelect: 1 },
            { question: 'Causa: Un estudiante usa un diagrama de causa-efecto para analizar un problema social. <br> Efecto: …', options: ['Logra identificar los orígenes del problema.', 'Ordena eventos cronológicamente.', 'Compara dos teorías.', 'Sintetiza proporciones de un todo.'], answer: 'Logra identificar los orígenes del problema.', explanation: 'A) Logra identificar los orígenes del problema. <br> Ese es el propósito del diagrama de causa-efecto.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordene las palabras para formar la definición correcta: <br> "central – es – del – idea – texto – la – principal"', options: ['La idea principal es central del texto.', 'La idea central es principal del texto.', 'La idea principal del texto es central.', 'La idea del texto principal es central.'], answer: 'La idea principal es central del texto.', explanation: 'A) La idea principal es central del texto. <br> Es la ordenación correcta y con sentido.', multi: 'OFF', maxSelect: 1 },
            { question: 'Si un gráfico circular muestra: 60% Agricultura, 25% Industria, 15% Servicios, ¿qué inferencia es válida?', options: ['La industria es el sector predominante.', 'El sector servicios es el mayor.', 'La agricultura es la actividad principal.', 'No hay sector industrial.'], answer: 'La agricultura es la actividad principal.', explanation: 'C) La agricultura es la actividad principal. <br> 60 % es claramente el porcentaje más alto.', multi: 'OFF', maxSelect: 1 },
            { question: 'Indique si los siguientes enunciados son Verdaderos (V) o Falsos (F): <br> 1) Los mapas conceptuales sirven para ordenar eventos en el tiempo. <br> 2) Las líneas de tiempo muestran relaciones jerárquicas. <br> 3) Los diagramas de Venn son útiles para comparar. <br> 4) Las tablas comparativas organizan datos en filas y columnas.', options: ['F-F-V-V', 'V-V-F-F', 'F-V-F-V', 'V-F-V-F'], answer: 'F-F-V-V', explanation: 'A) F-F-V-V <br> F – Los mapas conceptuales no ordenan eventos en el tiempo. <br> F – Las líneas de tiempo no muestran jerarquías. <br> V – Los diagramas de Venn sirven para comparar. <br> V – Las tablas organizan datos en filas y columnas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Complete la analogía: <br> Texto narrativo es a entretener como texto argumentativo es a ________.', options: ['informar', 'persuadir', 'describir', 'enumerar'], answer: 'persuadir', explanation: 'B) persuadir <br> Texto narrativo → entretener; texto argumentativo → persuadir.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál NO es una estrategia de lectura comprensiva?', options: ['Identificar el género textual', 'Subrayar ideas principales', 'Ignorar títulos y subtítulos', 'Formular preguntas de reflexión'], answer: 'Ignorar títulos y subtítulos', explanation: 'C) Ignorar títulos y subtítulos <br> Eso no es una estrategia de lectura comprensiva; al contrario, deben atenderse.', multi: 'OFF', maxSelect: 1 },
            { question: 'Complete: <br> "Las ideas secundarias ________ la idea principal con ________, ejemplos o datos ________."', options: ['contradicen – opiniones – centrales', 'complementan – detalles – accesorios', 'eliminan – resúmenes – esenciales', 'sustituyen – gráficos – principales'], answer: 'complementan – detalles – accesorios', explanation: 'B) complementan – detalles – accesorios <br> Las ideas secundarias complementan la principal con detalles, ejemplos o datos accesorios.', multi: 'OFF', maxSelect: 1 },
            { question: 'Relacione cada género textual con su estructura típica: <br> <br> Género <br> 1) Narrativo <br> 2) Argumentativo <br> 3) Expositivo <br> <br> Estructura <br> a) Tesis - argumentos – conclusión <br> b) Introducción - nudo – desenlace <br> c) Idea principal - detalles - ejemplos - conclusión', options: ['1b - 2a - 3c', '1a - 2c - 3b', '1c - 2b - 3a', '1b - 2c - 3a'], answer: '1b - 2a - 3c', explanation: 'A) 1b – 2a – 3c <br> Narrativo → introducción-nudo-desenlace. <br> Argumentativo → tesis-argumentos-conclusión. <br> Expositivo → idea principal-detalles-ejemplos-conclusión.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordene los pasos para interpretar una tabla: <br> 1) Identificar variables <br> 2) Leer título <br> 3) Inferir tendencias <br> 4) Revisar notas al pie', options: ['2-1-4-3', '1-2-3-4', '4-3-2-1', '2-4-1-3'], answer: '2-1-4-3', explanation: 'A) 2-1-4-3 <br> Orden lógico: título → variables → notas → inferir tendencias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: “La globalización ha facilitado el intercambio cultural y económico, pero también ha generado desigualdades entre países desarrollados y en vías de desarrollo.” <br> ¿Cuál es la idea principal?', options: ['Intercambio cultural', 'Desigualdades entre países', 'Globalización con efectos positivos y negativos', 'Países en vías de desarrollo'], answer: 'Globalización con efectos positivos y negativos', explanation: 'C) Globalización con efectos positivos y negativos <br> Resume tanto el intercambio positivo como las desigualdades.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: “Un gráfico de barras muestra el porcentaje de población con acceso a internet: Europa 85%, Asia 45%, África 22%.” <br> ¿Qué se puede inferir?', options: ['Europa tiene la menor conectividad.', 'África tiene la mayor brecha digital.', 'Asia tiene igual acceso que Europa.', 'No hay diferencias significativas.'], answer: 'África tiene la mayor brecha digital.', explanation: 'B) África tiene la mayor brecha digital. <br> 22 % es el porcentaje más bajo, por lo que presenta la mayor brecha.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál organizador gráfico es más adecuado para mostrar la evolución de la democracia en un país?', options: ['Diagrama de Venn', 'Línea de tiempo', 'Mapa conceptual', 'Diagrama de causa-efecto'], answer: 'Línea de tiempo', explanation: 'B) Línea de tiempo <br> Es el organizador ideal para mostrar evolución a lo largo del tiempo.', multi: 'OFF', maxSelect: 1 },
            { question: 'Seleccione dos beneficios de los organizadores gráficos: <br> 1) Saturan con detalles innecesarios <br> 2) Favorecen la memoria visual <br> 3) Dificultan el análisis <br> 4) Mejoran la comprensión', options: ['1 y 2', '2 y 3', '3 y 4', '2 y 4'], answer: '2 y 4', explanation: 'D) 2 y 4 <br> Beneficios: favorecen la memoria visual y mejoran la comprensión.', multi: 'OFF', maxSelect: 1 },
            { question: 'Seleccione tres estrategias para una lectura comprensiva: <br> 1) Identificar género textual <br> 2) Ignorar el título <br> 3) Activar conocimientos previos <br> 4) Hacer inferencias <br> 5) Evitar preguntas <br> 6) Subrayar ideas principales', options: ['1, 3, 4', '2, 4, 6', '3, 5, 6', '1, 2, 5'], answer: '1, 3, 4', explanation: 'A) 1, 3, 4 <br> Estrategias correctas: identificar género, activar conocimientos previos y hacer inferencias. Las demás son incorrectas o contraproducentes.', multi: 'OFF', maxSelect: 1 },
            { question: 'Causa: Un texto incluye muchas ideas secundarias. <br> Efecto: …', options: ['El texto se vuelve confuso y pierde enfoque.', 'La idea principal se fortalece automáticamente.', 'El texto se hace más corto.', 'Las ideas principales se eliminan.'], answer: 'El texto se vuelve confuso y pierde enfoque.', explanation: 'A) El texto se vuelve confuso y pierde enfoque. <br> Exceso de ideas secundarias puede diluir el mensaje central.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordene: <br> "visuales – organizadores – gráficos – herramientas – son"', options: ['Los organizadores gráficos son herramientas visuales.', 'Herramientas visuales son organizadores gráficos.', 'Organizadores son herramientas gráficas visuales.', 'Gráficos visuales son herramientas organizadoras.'], answer: 'Los organizadores gráficos son herramientas visuales.', explanation: 'A) Los organizadores gráficos son herramientas visuales. <br> Ordenación correcta y con sentido.', multi: 'OFF', maxSelect: 1 },
            { question: 'Si un párrafo habla sobre "las causas de la migración rural-urbana: falta de empleo, educación y servicios básicos", ¿cuál es la idea principal?', options: ['Falta de empleo', 'Migración rural-urbana y sus causas', 'Servicios básicos en zonas rurales', 'Educación en ciudades'], answer: 'Migración rural-urbana y sus causas', explanation: 'B) Migración rural-urbana y sus causas <br> Es la idea que abarca el párrafo completo.', multi: 'OFF', maxSelect: 1 },
            { question: 'Indique si los siguientes enunciados son Verdaderos (V) o Falsos (F): <br> 1) Las notas al pie en una tabla aclaran detalles metodológicos. <br> 2) El título de una tabla es opcional. <br> 3) Los ejes son relevantes solo en gráficos, no en tablas. <br> 4) Comparar datos ayuda a identificar tendencias.', options: ['V-F-F-V', 'F-V-V-F', 'V-V-F-F', 'F-F-V-V'], answer: 'V-F-F-V', explanation: 'A) V-F-F-V <br> 1. V – Las notas al pie aclaran detalles. <br> 2. F – El título no es opcional; es esencial. <br> 3. F – Los ejes/variables también son relevantes en tablas. <br> 4. V – Comparar datos permite identificar tendencias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Complete la analogía: <br> Idea principal es a tronco como ideas secundarias son a ________.', options: ['raíces', 'ramas', 'hojas', 'frutos'], answer: 'ramas', explanation: 'B) ramas <br> La idea principal es el tronco (estructura central); las secundarias son las ramas que se desprenden de ella.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál de las siguientes NO es una función de los organizadores gráficos?', options: ['Facilitar la comprensión', 'Mejorar la memoria visual', 'Sustituir completamente la lectura del texto', 'Organizar la información'], answer: 'Sustituir completamente la lectura del texto', explanation: 'C) Sustituir completamente la lectura del texto <br> Los organizadores complementan, no sustituyen la lectura.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: “El cambio climático afecta a todos los ecosistemas, provocando migración de especies, alteración de ciclos naturales y pérdida de biodiversidad.” <br> ¿Cuál es la idea principal?', options: ['Migración de especies', 'Pérdida de biodiversidad', 'El cambio climático afecta a los ecosistemas', 'Alteración de ciclos naturales'], answer: 'El cambio climático afecta a los ecosistemas', explanation: 'C) El cambio climático afecta a los ecosistemas <br> Resume el párrafo; el resto son consecuencias secundarias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Seleccione la secuencia correcta de pasos para una lectura comprensiva: <br> 1) Formular preguntas <br> 2) Leer el título y subtítulos <br> 3) Identificar ideas principales <br> 4) Activar conocimientos previos', options: ['2-4-1-3', '1-2-3-4', '4-2-1-3', '2-1-4-3'], answer: '2-4-1-3', explanation: 'A) 2-4-1-3 <br> Orden lógico: título → conocimientos previos → preguntas → ideas principales.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Qué organizador gráfico usarías para representar las causas y consecuencias de la contaminación del agua?', options: ['Línea de tiempo', 'Diagrama de Venn', 'Diagrama de causa-efecto', 'Mapa mental'], answer: 'Diagrama de causa-efecto', explanation: 'C) Diagrama de causa-efecto <br> Ideal para mostrar causas y consecuencias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Indique V o F: <br> 1) Una idea principal puede estar implícita. <br> 2) Las ideas secundarias nunca se pueden eliminar. <br> 3) El título ayuda a anticipar el contenido. <br> 4) Los organizadores gráficos solo se usan en textos científicos.', options: ['V-F-V-F', 'F-V-F-V', 'V-V-F-F', 'F-F-V-V'], answer: 'V-F-V-F', explanation: 'A) V-F-V-F <br> 1. V – Puede ser implícita. <br> 2. F – Sí se pueden eliminar sin perder el sentido global. <br> 3. V – El título anticipa. <br> 4. F – Se usan en cualquier tipo de texto.', multi: 'OFF', maxSelect: 1 },
            { question: 'Complete: “Para identificar la idea principal es útil preguntarse ________.”', options: ['¿Cuántos párrafos tiene el texto?', '¿De qué trata realmente el texto?', '¿Qué adjetivos aparecen más?', '¿Quién escribió el texto?'], answer: '¿De qué trata realmente el texto?', explanation: 'B) ¿De qué trata realmente el texto? <br> Es la pregunta clave para hallar la idea principal.', multi: 'OFF', maxSelect: 1 },
            { question: 'Un estudiante subraya solo las oraciones que contienen ejemplos. ¿Qué tipo de ideas está identificando?', options: ['Ideas principales', 'Ideas secundarias', 'Ideas implícitas', 'Ideas contradictorias'], answer: 'Ideas secundarias', explanation: 'B) Ideas secundarias <br> Los ejemplos son típicos de las ideas secundarias.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál es la mejor estrategia después de leer un texto complejo?', options: ['Memorizar todas las palabras', 'Elaborar un organizador gráfico', 'Ignorar las partes difíciles', 'Leer solo el primer párrafo'], answer: 'Elaborar un organizador gráfico', explanation: 'B) Elaborar un organizador gráfico <br> Ayuda a estructurar y comprender la información.', multi: 'OFF', maxSelect: 1 },
            { question: 'Relacione: <br> 1. Idea principal <br> 2. Idea secundaria <br> a) Detalle o ejemplo <br> b) Mensaje central', options: ['1a 2b', '1b 2a', '1a 2a', '1b 2b'], answer: '1b 2a', explanation: 'B) 1b – 2a <br> Idea principal = mensaje central; secundaria = detalle o ejemplo.', multi: 'OFF', maxSelect: 1 },
            { question: 'Si un texto tiene varias ideas secundarias muy extensas, ¿qué puede ocurrir?', options: ['El texto se vuelve más claro', 'Se diluye la idea principal', 'Aumenta la coherencia', 'Se elimina la necesidad de organizadores'], answer: 'Se diluye la idea principal', explanation: 'B) Se diluye la idea principal <br> Demasiados detalles pueden hacer perder el enfoque central.', multi: 'OFF', maxSelect: 1 },

            { question: 'Idea principal. <br> En el texto: “El reciclaje reduce la cantidad de residuos, ahorra energía y protege los recursos naturales.” <br> La idea principal es:', options: ['Ahorra energía', 'Protege los recursos naturales', 'El reciclaje tiene múltiples beneficios ambientales', 'Reduce la cantidad de residuos'], answer: 'El reciclaje tiene múltiples beneficios ambientales', explanation: 'Resume todas las consecuencias positivas mencionadas.', multi: 'OFF', maxSelect: 1 },

        // ========== CONFIGURACIÓN DEL TEMPORIZADOR DE EVALUACIÓN ==========
        // Tiempo total: 16 minutos = 960 segundos (igual que Tema 1)
        const EVAL_TIMER_SECONDS = 960;

        // Tres fases de color según el tiempo RESTANTE (en segundos).
        const EVAL_TIMER_PHASES = [
            { minSeconds: 480, colorClass: 'text-emerald-600 bg-emerald-50 border-emerald-300' }, // ≥ 8 min → verde
            { minSeconds: 60,  colorClass: 'text-amber-600 bg-amber-50 border-amber-300' },     // ≥ 1 min  → ámbar
            { minSeconds: 0,   colorClass: 'text-red-600 bg-red-50 border-red-300' }            // < 1 min  → rojo
        ];
        // ==================================================================

        let state = {
            currentMode: 'deber',
            view: 'quiz_home',
            studentName: '',
            studentEmail: '',
            activeQuestions: [],
            currentQuestion: 0,
            score: 0,
            selectedAnswer: null,
            isAnswerCorrect: null,
            emailStatus: null,
            emailAnalysis: null,
            emailAnalysisMsg: '',
            timeLeft: 0
        };

        let timerInterval = null;

        const disposableDomains = [
            'tempmail.com','temp-mail.org','guerrillamail.com','10minutemail.com','mailinator.com',
            'yopmail.com','throwawaymail.com','fakeinbox.com','trashmail.com','getnada.com',
            'maildrop.cc','dispostable.com','sharklasers.com','guerrillamailblock.com'
        ];
        const trustedProviders = [
            'gmail.com','googlemail.com','hotmail.com','hotmail.es','hotmail.co.uk','outlook.com',
            'outlook.es','live.com','msn.com','yahoo.com','yahoo.es','icloud.com','me.com',
            'protonmail.com','proton.me','aol.com','zoho.com','gmx.com','mail.com'
        ];

        function isValidEmailFormat(email) {
            const re = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
            return re.test(email) && email.length <= 254 && !email.includes('..') && !email.startsWith('.') && !email.endsWith('.');
        }

        function analyzeEmail(email) {
            const lower = email.toLowerCase().trim();
            if (!lower) return { valid: false, msg: 'Escribe un correo electrónico.' };
            if (!isValidEmailFormat(lower)) return { valid: false, msg: 'Formato inválido. Revisa que tenga @ y un dominio correcto.' };
            const domain = lower.split('@')[1];
            if (!domain || domain.length < 3) return { valid: false, msg: 'Dominio incompleto o inválido.' };
            if (disposableDomains.some(d => domain === d || domain.endsWith('.' + d))) {
                return { valid: false, msg: 'Correo temporal / desechable detectado. Usa un correo real.' };
            }
            const isTrusted = trustedProviders.some(p => domain === p);
            const hasGoodTld = /\.(com|es|net|org|edu|gov|mx|ar|co|uk|de|fr|it|pt|br|cl)$/i.test(domain);
            if (!hasGoodTld && !isTrusted) {
                return { valid: false, msg: 'Dominio poco común o sospechoso. Usa Gmail, Hotmail/Outlook, Yahoo, etc.' };
            }
            let analysisText = '';
            if (domain.includes('hotmail') || domain.includes('outlook') || domain.includes('live.com') || domain.includes('msn.com')) {
                analysisText = 'Análisis: proveedor Microsoft (Hotmail/Outlook) detectado · formato correcto · dominio legítimo';
            } else if (domain.includes('gmail') || domain.includes('googlemail')) {
                analysisText = 'Análisis: proveedor Google (Gmail) detectado · formato correcto · dominio legítimo';
            } else if (isTrusted) {
                analysisText = 'Análisis: proveedor conocido · formato correcto · dominio legítimo';
            } else {
                analysisText = 'Análisis: formato válido · dominio con TLD estándar · no se detectaron patrones de correo temporal';
            }
            return { valid: true, msg: analysisText };
        }

        function showSection(section, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            stopTimer();
            const app = document.getElementById('app');
            if (section === 'pdf') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">📄 Pizarra Virtual</h2><div class="iframe-container"><iframe src="${DRIVE_PDF_URL}" width="100%" height="100%" allow="autoplay"></iframe></div></div>`;
            } else if (section === 'video') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">🎥 Video Clase</h2><div class="iframe-container"><iframe src="${DRIVE_VIDEO_URL}" width="100%" height="100%" allow="autoplay"></iframe></div></div>`;
            }
        }

        function prepQuiz(mode, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            stopTimer();
            state = {
                currentMode: mode,
                view: 'quiz_home',
                studentName: '',
                studentEmail: '',
                activeQuestions: [],
                currentQuestion: 0,
                score: 0,
                selectedAnswer: null,
                isAnswerCorrect: null,
                emailStatus: null,
                emailAnalysis: null,
                emailAnalysisMsg: '',
                timeLeft: 0
            };
            render();
        }

        function startQuiz() {
            if (state.currentMode === 'deber') {
                // Deber: 50 preguntas en orden
                state.activeQuestions = [...quizData];
            } else if (state.currentMode === 'evaluacion') {
                // Repaso: 20 preguntas aleatorias
                state.activeQuestions = [...quizData]
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 20);
            } else if (state.currentMode === 'extra') {
                // Evaluación: 16 preguntas en orden
                state.activeQuestions = [...quizDataExtra];
            }
            state.view = 'name_input';
            state.emailAnalysis = null;
            state.emailAnalysisMsg = '';
            render();
        }

        function onEmailInput() {
            const e = document.getElementById('email-in');
            if (!e) return;
            const val = e.value.trim();
            if (val.length < 5) {
                state.emailAnalysis = null;
                state.emailAnalysisMsg = '';
                updateEmailUI();
                return;
            }
            state.emailAnalysis = 'checking';
            state.emailAnalysisMsg = 'Analizando correo…';
            updateEmailUI();
            clearTimeout(window._emailCheckTimer);
            window._emailCheckTimer = setTimeout(() => {
                const result = analyzeEmail(val);
                state.emailAnalysis = result.valid ? 'valid' : 'invalid';
                state.emailAnalysisMsg = result.msg;
                updateEmailUI();
            }, 600);
        }

        function updateEmailUI() {
            const feedback = document.getElementById('email-feedback');
            const analysis = document.getElementById('email-analysis');
            const input = document.getElementById('email-in');
            if (!feedback || !analysis || !input) return;
            if (state.emailAnalysis === 'checking') {
                feedback.innerHTML = `<span class="text-slate-500 text-sm flex items-center gap-2"><span class="dot-pulse">●</span> Verificando…</span>`;
                analysis.innerHTML = `<p class="text-xs text-slate-400 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            } else if (state.emailAnalysis === 'invalid') {
                feedback.innerHTML = `<span class="text-red-600 text-sm font-semibold">✗ Correo no válido o inexistente</span>`;
                analysis.innerHTML = `<p class="text-xs text-red-500/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-emerald-400', 'border-slate-300');
                input.classList.add('border-red-400');
            } else if (state.emailAnalysis === 'valid') {
                feedback.innerHTML = `<span class="text-emerald-600 text-sm font-semibold">✓ Correo aceptado</span>`;
                analysis.innerHTML = `<p class="text-xs text-emerald-600/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-slate-300');
                input.classList.add('border-emerald-400');
            } else {
                feedback.innerHTML = '';
                analysis.innerHTML = '';
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            }
        }

        function validaDatos() {
            const n = document.getElementById('name-in').value.trim();
            const e = document.getElementById('email-in').value.trim();
            if (n.length <= 2) {
                alert("Ingresa nombre completo (mínimo 3 caracteres).");
                return;
            }
            const result = analyzeEmail(e);
            state.emailAnalysis = result.valid ? 'valid' : 'invalid';
            state.emailAnalysisMsg = result.msg;
            updateEmailUI();
            if (!result.valid) return;
            state.studentName = n;
            state.studentEmail = e;
            state.view = 'playing';
            if (state.currentMode === 'extra') {
                startTimer();
            }
            render();
        }

        // ---------- TEMPORIZADOR (solo Evaluación / extra) ----------
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function getTimerPhaseClass(remaining) {
            for (const phase of EVAL_TIMER_PHASES) {
                if (remaining >= phase.minSeconds) {
                    return phase.colorClass;
                }
            }
            return EVAL_TIMER_PHASES[EVAL_TIMER_PHASES.length - 1].colorClass;
        }

        function startTimer() {
            stopTimer();
            state.timeLeft = EVAL_TIMER_SECONDS;
            timerInterval = setInterval(() => {
                state.timeLeft--;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    stopTimer();
                    state.view = 'results';
                    render();
                    enviarCorreo();
                    return;
                }
                const timerEl = document.getElementById('eval-timer');
                if (timerEl) {
                    timerEl.textContent = formatTime(state.timeLeft);
                    timerEl.className = `px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ---------- LÓGICA SINGLE + MULTI ----------
        function isMultiQuestion(q) {
            return q.multi === 'ON';
        }

        function arraysEqual(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b)) return false;
            if (a.length !== b.length) return false;
            const sa = [...a].sort();
            const sb = [...b].sort();
            return sa.every((v, i) => v === sb[i]);
        }

        function handleAnswer(idx) {
            if (state.isAnswerCorrect !== null) return;
            const currentQ = state.activeQuestions[state.currentQuestion];
            const option = currentQ.options[idx];

            if (isMultiQuestion(currentQ)) {
                let selected = Array.isArray(state.selectedAnswer) ? [...state.selectedAnswer] : [];
                const pos = selected.indexOf(option);
                if (pos > -1) {
                    selected.splice(pos, 1);
                } else {
                    if (selected.length >= currentQ.maxSelect) return;
                    selected.push(option);
                }
                state.selectedAnswer = selected;
                render();
            } else {
                if (state.selectedAnswer !== null) return;
                state.selectedAnswer = option;
                state.isAnswerCorrect = (option === currentQ.answer);
                if (state.isAnswerCorrect) state.score++;
                render();
                if (state.isAnswerCorrect) {
                    setTimeout(() => nextQuestion(), 1000);
                }
            }
        }

        function checkMultiAnswer() {
            if (state.isAnswerCorrect !== null) return;
            const currentQ = state.activeQuestions[state.currentQuestion];
            if (!isMultiQuestion(currentQ)) return;
            const selected = Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [];
            if (selected.length === 0) return;
            const correctAnswers = Array.isArray(currentQ.answer) ? currentQ.answer : [currentQ.answer];
            state.isAnswerCorrect = arraysEqual(selected, correctAnswers);
            if (state.isAnswerCorrect) state.score++;
            render();
            if (state.isAnswerCorrect) {
                setTimeout(() => nextQuestion(), 1000);
            }
        }

        function nextQuestion() {
            if (state.currentQuestion + 1 < state.activeQuestions.length) {
                state.currentQuestion++;
                state.selectedAnswer = null;
                state.isAnswerCorrect = null;
                render();
            } else {
                stopTimer();
                state.view = 'results';
                render();
                enviarCorreo();
            }
        }

        function enviarCorreo() {
            if (!state.studentEmail) return;
            state.emailStatus = 'sending';
            render();
            const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
            const totalQ = state.activeQuestions.length;
            let imageUrl = '';
            let mensaje = '';
            if (scorePerc >= 90) {
                imageUrl = 'https://img.icons8.com/color/128/medal2.png';
                mensaje = `¡Excelente trabajo, ${state.studentName}! Obtuviste un resultado sobresaliente.`;
            } else if (scorePerc >= 70) {
                imageUrl = 'https://img.icons8.com/color/128/diploma.png';
                mensaje = `¡Muy bien, ${state.studentName}! Has aprobado con un buen resultado.`;
            } else if (scorePerc >= 50) {
                imageUrl = 'https://img.icons8.com/color/128/ok.png';
                mensaje = `Buen esfuerzo, ${state.studentName}. Sigue practicando para mejorar.`;
            } else {
                imageUrl = 'https://img.icons8.com/color/128/error.png';
                mensaje = `Ánimo, ${state.studentName}. Revisa el material y vuelve a intentarlo.`;
            }
            const params = {
                to_name: state.studentName,
                to_email: state.studentEmail,
                score: scorePerc,
                correct_answers: state.score,
                total_questions: totalQ,
                mode_name: state.currentMode.toUpperCase(),
                image_url: imageUrl,
                mensaje: mensaje,
                fecha: new Date().toLocaleDateString('es-ES', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                })
            };
            emailjs.send("service_dhvsi72", "template_cy74x9h", params)
                .then(() => {
                    state.emailStatus = 'success';
                    render();
                })
                .catch((err) => {
                    console.error('Error EmailJS:', err);
                    state.emailStatus = 'error';
                    render();
                });
        }

        function render() {
            const app = document.getElementById('app');
            
            let modeTitle = '';
            let modeDesc = '';
            if (state.currentMode === 'deber') {
                modeTitle = '📚 Deber';
                modeDesc = 'Resuelve las 50 preguntas del banco en orden.';
            } else if (state.currentMode === 'evaluacion') {
                modeTitle = '📝 Repaso';
                modeDesc = 'Prueba de 20 preguntas seleccionadas al azar.';
            } else if (state.currentMode === 'extra') {
                modeTitle = '📊 Evaluación';
                modeDesc = 'Resuelve las 16 preguntas de la Evaluación (tiempo límite: 16 min).';
            }
            
            if (state.view === 'quiz_home') {
                app.innerHTML = `
                <div class="text-center py-16 animate-fade-in bg-white rounded-[3rem] shadow-xl border">
                    <h2 class="text-4xl font-black text-slate-800 mb-2">${modeTitle}</h2>
                    <p class="text-slate-500 mb-8 text-lg">${modeDesc}</p>
                    <button onclick="startQuiz()" class="bg-emerald-600 text-white px-12 py-5 rounded-2xl font-black text-xl hover:bg-emerald-700 transition-all">
                        INICIAR
                    </button>
                </div>`;
            }

            if (state.view === 'name_input') {
                app.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-10 rounded-[2.5rem] shadow-2xl animate-fade-in">
                    <h2 class="text-2xl font-black mb-6 text-center">Registro de Estudiante</h2>
                    <input id="name-in" type="text" placeholder="Nombre y Apellido completo" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-4 focus:border-emerald-500 outline-none">
                    
                    <div class="relative mb-1">
                        <input id="email-in" type="email" placeholder="Correo para recibir nota (Gmail, Hotmail…)" 
                               class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl focus:border-emerald-500 outline-none transition-colors"
                               oninput="onEmailInput()" onblur="onEmailInput()">
                    </div>
                    
                    <div id="email-feedback" class="min-h-[22px] mb-1"></div>
                    <div id="email-analysis" class="mb-5"></div>
                    
                    <button onclick="validaDatos()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-all">
                        ENTRAR AL TEST
                    </button>
                    <p class="text-center text-[11px] text-slate-400 mt-4">Se verifica formato y se descartan correos temporales. No se envía nada hasta terminar el test.</p>
                </div>`;
                setTimeout(updateEmailUI, 50);
            }

            if (state.view === 'playing') {
                const q = state.activeQuestions[state.currentQuestion];
                const progress = ((state.currentQuestion + 1) / state.activeQuestions.length) * 100;
                const multi = isMultiQuestion(q);
                const selected = multi
                    ? (Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [])
                    : (state.selectedAnswer ? [state.selectedAnswer] : []);

                const multiHint = multi
                    ? `<p class="text-sm text-sky-600 font-semibold mb-4">
                         Selección múltiple · elige ${q.maxSelect} respuesta${q.maxSelect > 1 ? 's' : ''}
                         ${selected.length > 0 ? `(${selected.length}/${q.maxSelect})` : ''}
                       </p>`
                    : '';

                // Timer solo en Evaluación (extra)
                const timerHtml = (state.currentMode === 'extra')
                    ? `<div id="eval-timer" class="px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}">
                           ${formatTime(state.timeLeft)}
                       </div>`
                    : '';

                app.innerHTML = `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-6 px-4 gap-4">
                        <span class="font-black text-emerald-600">${state.currentQuestion + 1} / ${state.activeQuestions.length}</span>
                        <div class="flex-1 max-w-xs bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all" style="width:${progress}%"></div>
                        </div>
                        ${timerHtml}
                    </div>
                    <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 leading-tight">${q.question}</h2>
                        ${multiHint}
                        <div class="grid gap-3">
                            ${q.options.map((opt, idx) => {
                                let style = "border-slate-100 bg-slate-50 hover:border-emerald-200";
                                const isSelected = selected.includes(opt);

                                if (state.isAnswerCorrect !== null) {
                                    if (multi) {
                                        const correctSet = Array.isArray(q.answer) ? q.answer : [q.answer];
                                        if (correctSet.includes(opt) && isSelected) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected && !correctSet.includes(opt)) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        } else if (correctSet.includes(opt) && !isSelected) {
                                            style = "border-emerald-300 bg-emerald-50 text-emerald-700";
                                        }
                                    } else {
                                        if (opt === q.answer) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        }
                                    }
                                } else if (isSelected) {
                                    if (multi) {
                                        style = "border-sky-400 bg-sky-100 text-sky-800";
                                    } else {
                                        style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                    }
                                }

                                return `<button onclick="handleAnswer(${idx})" 
                                            class="p-5 text-left border-2 rounded-xl font-bold transition-all ${style}">
                                            ${opt}
                                        </button>`;
                            }).join('')}
                        </div>

                        ${multi && state.isAnswerCorrect === null ? `
                            <button onclick="checkMultiAnswer()" 
                                class="mt-6 w-full py-4 rounded-xl font-bold transition-all
                                ${selected.length === q.maxSelect 
                                    ? 'bg-sky-600 text-white hover:bg-sky-700' 
                                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                                ${selected.length !== q.maxSelect ? 'disabled' : ''}>
                                Comprobar respuesta (${selected.length}/${q.maxSelect})
                            </button>
                        ` : ''}

                        ${state.selectedAnswer !== null && state.isAnswerCorrect === false ? `
                            <div class="mt-6 p-5 bg-amber-50 border border-amber-200 rounded-xl">
                                <p class="font-bold text-amber-800 mb-2">Explicación:</p>
                                <p class="text-slate-700">${q.explanation}</p>
                            </div>
                            <button onclick="nextQuestion()" class="mt-6 w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all">
                                Siguiente pregunta
                            </button>
                        ` : ''}
                    </div>
                </div>`;
            }

            if (state.view === 'results') {
                const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
                app.innerHTML = `
                <div class="max-w-md mx-auto text-center animate-fade-in bg-white p-12 rounded-[3rem] shadow-2xl">
                    <h2 class="text-2xl font-black mb-2">${state.studentName}</h2>
                    <p class="text-slate-400 uppercase text-xs font-bold mb-6">${state.currentMode}</p>
                    <div class="text-7xl font-black text-emerald-600 mb-4">${scorePerc}%</div>
                    <p class="text-lg font-bold text-slate-700 mb-10">${state.score} / ${state.activeQuestions.length} correctas</p>
                    <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">VOLVER AL INICIO</button> 
                    <p class="mt-6 text-xs font-bold text-slate-400"> 
                        ${state.emailStatus === 'success' ? '✅ Nota e imagen enviadas al correo' : 
                          state.emailStatus === 'error' ? '⚠️ Error al enviar nota e imagen' : 
                          '⏳ Enviando nota e imagen al correo...'}
                    </p>
                </div>`;
            }
        }
        render();
    </script>
</body>
</html>
