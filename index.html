    <script>
        const DRIVE_PDF_URL = "https://drive.google.com/file/d/1tPdsfPZVt-oOM-a1YmCbr8oMPMprzbl2/view?usp=sharing";
        const DRIVE_VIDEO_URL = "https://drive.google.com/file/d/1GdrzGCZvmDtz_sHZogW4ijLBEXfeOyCk/view?usp=sharing";

        // PRINCIPAL (Práctica + Repaso)
        const quizData = [
           { question: 'Ideas principales y secundarias <br> Indique si los siguientes enunciados son Verdaderos (V) o Falsos (F) según el texto: <br> 1) La idea principal puede suprimirse sin que el texto pierda sentido. <br> 2) Las ideas secundarias aportan ejemplos y detalles. <br> 3) La idea principal siempre está explícita. <br> 4) Las ideas secundarias dependen de la idea principal.', options: ['V-V-V-V', 'F-V-F-V', 'V-F-V-F', 'F-V-F-F'], answer: 'F-V-F-V', explanation: 'B) F-V-F-V <br> Explicación: <br> 1 es Falsa (si se elimina la idea principal el texto pierde sentido). <br> 2 es Verdadera (las secundarias aportan ejemplos, detalles y datos). <br> 3 es Falsa (puede estar implícita). <br> 4 es Verdadera (dependen y se subordinan a la principal)..', multi: 'OFF', maxSelect: 1 },
            { question: 'Ideas principales <br> Complete la analogía: <br> Idea principal es a esencia como idea secundaria es a ________.', options: ['fundamental', 'complemento', 'eliminable', 'central'], answer: 'complemento', explanation: 'B) complemento <br> Explicación: La idea principal es la esencia del texto; las secundarias la complementan con detalles, ejemplos o aclaraciones.', multi: 'OFF', maxSelect: 1 },
            { question: 'Características de las ideas principales <br> ¿Cuál NO es una característica de la idea principal?', options: ['Expresa el punto central del tema.', 'No depende de otras ideas.', 'Incluye detalles y ejemplos.', 'Si se elimina, el texto pierde sentido.'], answer: 'Incluye detalles y ejemplos.', explanation: 'C) Incluye detalles y ejemplos. <br> Explicación: Los detalles y ejemplos son propios de las ideas secundarias. La principal es general y nuclear.', multi: 'OFF', maxSelect: 1 },
            { question: 'Organizadores gráficos <br> Complete el texto: <br> "Los organizadores gráficos son herramientas ________ que permiten ________ la información y visualizar ________ entre conceptos."', options: ['auditivas – memorizar – diferencias', 'visuales – estructurar – relaciones', 'textuales – copiar – jerarquías', 'digitales – eliminar – conexiones'], answer: 'visuales – estructurar – relaciones', explanation: 'B) visuales – estructurar – relaciones <br> Explicación: Son herramientas visuales que ayudan a organizar y mostrar las relaciones entre ideas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Relacione cada organizador gráfico con su función principal: <br> Organizador <br> <br> 1. Diagrama de Venn <br> 2. Línea de tiempo <br> 3. Mapa conceptual <br> 4. Diagrama de causa-efecto <br> <br> Función <br> a) Ordenar eventos cronológicamente <br> b) Mostrar similitudes y diferencias <br> c) Identificar causas de un problema <br> d) Jerarquizar conceptos', options: ['1b 2a 3d 4c', '1a 2b 3c 4d', '1d 2c 3b 4a', '1c 2d 3a 4b'], answer: '1b 2a 3d 4c', explanation: '<br> 1. Diagrama de Venn &rarr; b) Mostrar similitudes y diferencias <br> 2. Línea de tiempo &rarr; a) Ordenar eventos cronológicamente <br> 3. Mapa conceptual &rarr; d) Jerarquizar conceptos <br> 4. Diagrama de causa-efecto &rarr; c) Identificar causas de un problema <br> Respuesta correcta: A) 1b 2a 3d 4c <br> Explicación: Cada organizador tiene una función específica que coincide exactamente con la descripción dada.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordene los pasos para interpretar una tabla: <br> 1) Identificar ejes y variables <br> 2) Leer el título <br> 3) Comparar datos y buscar tendencias <br> 4) Revisar leyendas y notas', options: ['2-1-4-3', '1-2-3-4', '4-3-2-1', '2-4-1-3'], answer: '2-4-1-3', explanation: 'D) 2-4-1-3 <br> Explicación: Primero se lee el título, luego las leyendas/notas, después se identifican variables y finalmente se comparan datos.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: <br> “La Revolución Industrial no solo transformó la economía, sino también la estructura social. Surgieron nuevas clases, como el proletariado, y se aceleró el crecimiento urbano.” <br> ¿Cuál es la idea principal?', options: ['Surgió el proletariado.', 'Crecimiento urbano acelerado.', 'Transformación económica y social por la Revolución Industrial.', 'La economía cambió.'], answer: 'Transformación económica y social por la Revolución Industrial.', explanation: 'C) Transformación económica y social por la Revolución Industrial. <br> Explicación: El texto presenta un cambio global (económico + social). El resto son ideas secundarias o parciales.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: “El uracilo hallado en el asteroide Ryugu sugiere que compuestos extraterrestres influyeron en el origen de la vida en la Tierra.” <br> ¿Qué idea secundaria se menciona?', options: ['El uracilo es un componente del ARN.', 'La sonda tomó muestras del asteroide.', 'Los asteroides contienen aminoácidos.', 'El origen de la vida es exclusivo de la Tierra.'], answer: 'La sonda tomó muestras del asteroide.', explanation: 'B) La sonda tomó muestras del asteroide. <br> Explicación: El texto no menciona explícitamente que la sonda tomó muestras, pero es la información secundaria más cercana a lo que se da (el hallazgo implica el muestreo). Las demás no aparecen o son incorrectas.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál es el organizador gráfico más adecuado para comparar dos teorías sociológicas?', options: ['Línea de tiempo', 'Diagrama de Venn', 'Mapa mental', 'Gráfico de barras'], answer: 'Diagrama de Venn', explanation: 'B) Diagrama de Venn <br> Explicación: El Diagrama de Venn es ideal para mostrar similitudes y diferencias entre dos conceptos o teorías.', multi: 'OFF', maxSelect: 1 },
            { question: 'Seleccione dos características de las ideas principales: <br> 1) Son eliminables sin afectar el sentido global. <br> 2) Expresan el mensaje central. <br> 3) Dependen de las ideas secundarias. <br> 4) Articulan y dan coherencia al texto.', options: ['1 y 2', '2 y 3', '3 y 4', '2 y 4'], answer: '2 y 4', explanation: 'D) 2 y 4 <br> Explicación: Las ideas principales expresan el mensaje central y dan coherencia. No son eliminables ni dependen de las secundarias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Seleccione tres estrategias para identificar ideas principales: <br> 1) Preguntarse: “¿De qué trata el texto?” <br> 2) Buscar oraciones temáticas al inicio o final. <br> 3) Subrayar todos los adjetivos. <br> 4) Eliminar todas las ideas secundarias. <br> 5) Usar la abstracción para reducir el texto a su esencia. <br> 6) Contar el número de párrafos.', options: ['1, 2, 5', '2, 3, 6', '3, 4, 5', '1, 4, 6'], answer: '1, 2, 5', explanation: 'A) 1, 2, 5 <br> Explicación: Preguntarse de qué trata el texto, buscar oraciones temáticas y usar la abstracción son estrategias válidas. Subrayar adjetivos o contar párrafos no lo son.', multi: 'OFF', maxSelect: 1 },
            { question: 'Causa: Un estudiante usa un diagrama de causa-efecto para analizar un problema social. <br> Efecto: …', options: ['Logra identificar los orígenes del problema.', 'Ordena eventos cronológicamente.', 'Compara dos teorías.', 'Sintetiza proporciones de un todo.'], answer: 'Logra identificar los orígenes del problema.', explanation: 'A) Logra identificar los orígenes del problema. <br> Explicación: Esa es precisamente la función del diagrama de causa-efecto.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordene las palabras para formar la definición correcta: <br> "central – es – del – idea – texto – la – principal"', options: ['La idea principal es central del texto.', 'La idea central es principal del texto.', 'La idea principal del texto es central.', 'La idea del texto principal es central.'], answer: 'La idea principal del texto es central.', explanation: 'C) La idea principal del texto es central. <br> Explicación: Es la única opción gramatical y semánticamente correcta.', multi: 'OFF', maxSelect: 1 },
            { question: 'Si un gráfico circular muestra: 60% Agricultura, 25% Industria, 15% Servicios, ¿qué inferencia es válida?', options: ['La industria es el sector predominante.', 'El sector servicios es el mayor.', 'La agricultura es la actividad principal.', 'No hay sector industrial.'], answer: 'La agricultura es la actividad principal.', explanation: 'C) La agricultura es la actividad principal. <br> Explicación: El sector con mayor porcentaje es el predominante.', multi: 'OFF', maxSelect: 1 },
            { question: 'Indique si los siguientes enunciados son Verdaderos (V) o Falsos (F): <br> 1) Los mapas conceptuales sirven para ordenar eventos en el tiempo. <br> 2) Las líneas de tiempo muestran relaciones jerárquicas. <br> 3) Los diagramas de Venn son útiles para comparar. <br> 4) Las tablas comparativas organizan datos en filas y columnas.', options: ['F-F-V-V', 'V-V-F-F', 'F-V-F-V', 'V-F-V-F'], answer: 'F-F-V-V', explanation: ' <br> 1. Mapas conceptuales &rarr;  ordenar eventos en el tiempo &rarr;  F <br> 2. Líneas de tiempo &rarr;  relaciones jerárquicas &rarr;  F <br> 3. Diagramas de Venn &rarr;  comparar &rarr;  V <br> 4. Tablas comparativas &rarr;  filas y columnas &rarr;  V <br> Respuesta correcta: A) F-F-V-V.', multi: 'OFF', maxSelect: 1 },
            { question: 'Complete la analogía: <br> Texto narrativo es a entretener como texto argumentativo es a ________.', options: ['informar', 'persuadir', 'describir', 'enumerar'], answer: 'persuadir', explanation: 'B) persuadir <br> Explicación: El propósito principal del texto argumentativo es convencer o persuadir.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál NO es una estrategia de lectura comprensiva?', options: ['Identificar el género textual', 'Subrayar ideas principales', 'Ignorar títulos y subtítulos', 'Formular preguntas de reflexión'], answer: 'Ignorar títulos y subtítulos', explanation: 'C) Ignorar títulos y subtítulos <br> Explicación: Los títulos y subtítulos orientan la lectura; ignorarlos es contraproducente.', multi: 'OFF', maxSelect: 1 },
            { question: 'Complete: <br> "Las ideas secundarias ________ la idea principal con ________, ejemplos o datos ________."', options: ['contradicen – opiniones – centrales', 'complementan – detalles – accesorios', 'eliminan – resúmenes – esenciales', 'sustituyen – gráficos – principales'], answer: 'complementan – detalles – accesorios', explanation: 'B) complementan – detalles – accesorios <br> Explicación: Las secundarias complementan la principal con detalles y datos accesorios.', multi: 'OFF', maxSelect: 1 },
            { question: 'Relacione cada género textual con su estructura típica: <br> <br> Género <br> 1) Narrativo <br> 2) Argumentativo <br> 3) Expositivo <br> <br> Estructura <br> a) Tesis - argumentos – conclusión <br> b) Introducción - nudo – desenlace <br> c) Idea principal - detalles - ejemplos - conclusión', options: ['1b - 2a - 3c', '1a - 2c - 3b', '1c - 2b - 3a', '1b - 2c - 3a'], answer: '1b - 2a - 3c', explanation: ' <br> 1. Narrativo &rarr;  b) Introducción-nudo-desenlace <br> 2. Argumentativo &rarr;  a) Tesis-argumentos-conclusión <br> 3. Expositivo &rarr;  c) Idea principal-detalles-ejemplos-conclusión <br> Respuesta correcta: A) 1b - 2a - 3c.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordene los pasos para interpretar una tabla: <br> 1) Identificar variables <br> 2) Leer título <br> 3) Inferir tendencias <br> 4) Revisar notas al pie', options: ['2-1-4-3', '1-2-3-4', '4-3-2-1', '2-4-1-3'], answer: '2-1-4-3', explanation: 'A) 2-1-4-3 <br> Explicación: Título &rarr;  variables &rarr;  notas &rarr;  inferencias/tendencias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: “La globalización ha facilitado el intercambio cultural y económico, pero también ha generado desigualdades entre países desarrollados y en vías de desarrollo.” <br> ¿Cuál es la idea principal?', options: ['Intercambio cultural', 'Desigualdades entre países', 'Globalización con efectos positivos y negativos', 'Países en vías de desarrollo'], answer: 'Globalización con efectos positivos y negativos', explanation: 'C) Globalización con efectos positivos y negativos <br> Explicación: El texto presenta ambos lados del fenómeno.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: “Un gráfico de barras muestra el porcentaje de población con acceso a internet: Europa 85%, Asia 45%, África 22%.” <br> ¿Qué se puede inferir?', options: ['Europa tiene la menor conectividad.', 'África tiene la mayor brecha digital.', 'Asia tiene igual acceso que Europa.', 'No hay diferencias significativas.'], answer: 'África tiene la mayor brecha digital.', explanation: 'B) África tiene la mayor brecha digital. <br> Explicación: Tiene el porcentaje más bajo (22 %).', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál organizador gráfico es más adecuado para mostrar la evolución de la democracia en un país?', options: ['Diagrama de Venn', 'Línea de tiempo', 'Mapa conceptual', 'Diagrama de causa-efecto'], answer: 'Línea de tiempo', explanation: 'B) Línea de tiempo <br> Explicación: La evolución temporal se representa mejor con una línea de tiempo.', multi: 'OFF', maxSelect: 1 },
            { question: 'Seleccione dos beneficios de los organizadores gráficos: <br> 1) Saturan con detalles innecesarios <br> 2) Favorecen la memoria visual <br> 3) Dificultan el análisis <br> 4) Mejoran la comprensión', options: ['1 y 2', '2 y 3', '3 y 4', '2 y 4'], answer: '2 y 4', explanation: 'D) 2 y 4 (Favorecen la memoria visual y Mejoran la comprensión) <br> Explicación: Son las dos ventajas reales; las otras son desventajas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Seleccione tres estrategias para una lectura comprensiva: <br> 1) Identificar género textual <br> 2) Ignorar el título <br> 3) Activar conocimientos previos <br> 4) Hacer inferencias <br> 5) Evitar preguntas <br> 6) Subrayar ideas principales', options: ['1, 3, 4', '2, 4, 6', '3, 5, 6', '1, 2, 5'], answer: '1, 3, 4', explanation: 'A) 1, 3, 4 <br> Explicación: Identificar género, activar conocimientos previos y hacer inferencias son estrategias válidas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Causa: Un texto incluye muchas ideas secundarias. <br> Efecto: …', options: ['El texto se vuelve confuso y pierde enfoque.', 'La idea principal se fortalece automáticamente.', 'El texto se hace más corto.', 'Las ideas principales se eliminan.'], answer: 'El texto se vuelve confuso y pierde enfoque.', explanation: 'A) El texto se vuelve confuso y pierde enfoque. <br> Explicación: El exceso de detalles secundarios puede desviar la atención de la idea principal.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordene: <br> "visuales – organizadores – gráficos – herramientas – son"', options: ['Los organizadores gráficos son herramientas visuales.', 'Herramientas visuales son organizadores gráficos.', 'Organizadores son herramientas gráficas visuales.', 'Gráficos visuales son herramientas organizadoras.'], answer: 'Los organizadores gráficos son herramientas visuales.', explanation: 'A) Los organizadores gráficos son herramientas visuales.', multi: 'OFF', maxSelect: 1 },
            { question: 'Si un párrafo habla sobre "las causas de la migración rural-urbana: falta de empleo, educación y servicios básicos", ¿cuál es la idea principal?', options: ['Falta de empleo', 'Migración rural-urbana y sus causas', 'Servicios básicos en zonas rurales', 'Educación en ciudades'], answer: 'Migración rural-urbana y sus causas', explanation: 'B) Migración rural-urbana y sus causas <br> Explicación: El tema general incluye el fenómeno y sus causas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Indique si los siguientes enunciados son Verdaderos (V) o Falsos (F): <br> 1) Las notas al pie en una tabla aclaran detalles metodológicos. <br> 2) El título de una tabla es opcional. <br> 3) Los ejes son relevantes solo en gráficos, no en tablas. <br> 4) Comparar datos ayuda a identificar tendencias.', options: ['V-F-F-V', 'F-V-V-F', 'V-V-F-F', 'F-F-V-V'], answer: 'V-F-F-V', explanation: 'A) V-F-F-V <br> Explicación: <br> 1. V (las notas aclaran), <br> 2. F (el título es esencial), <br> 3. F (también hay encabezados en tablas), <br> 4. V (comparar datos permite ver tendencias).', multi: 'OFF', maxSelect: 1 },
            { question: 'Complete la analogía: <br> Mapa conceptual es a jerarquía como línea de tiempo es a ________.', options: ['comparación', 'cronología', 'causa', 'proporción'], answer: 'cronología', explanation: 'B) cronología.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál NO es un elemento esencial para interpretar una tabla?', options: ['Título', 'Leyendas o notas', 'Número de párrafos del texto', 'Variables o encabezados'], answer: 'Número de párrafos del texto', explanation: 'C) Número de párrafos del texto <br> Explicación: No tiene relación con la lectura de la tabla.', multi: 'OFF', maxSelect: 1 },
            { question: 'Complete: <br> "Los textos ________ tienen como objetivo informar o explicar, mientras que los textos ________ buscan persuadir al lector."', options: ['narrativos – expositivos', 'expositivos – argumentativos', 'argumentativos – narrativos', 'descriptivos – expositivos'], answer: 'expositivos – argumentativos', explanation: 'B) expositivos – argumentativos <br> Explicación: Expositivos informan/explican; argumentativos persuaden.', multi: 'OFF', maxSelect: 1 },
            { question: 'Relacione cada ejemplo con su tipo: <br> <br> Ejemplo <br> 1) "La pandemia aumentó el desempleo global." <br> 2) "En 2020, el turismo cayó un 60%." <br> <br> Tipo <br> A) Idea secundaria <br> B) Idea principal', options: ['1A - 2B', '1B - 2A', '1A - 2A', '1B - 2B'], answer: '1B - 2A', explanation: ' <br> 1. “La pandemia aumentó el desempleo global.” &rarr;  Idea principal <br> 2. “En 2020, el turismo cayó un 60 %.” &rarr;  Idea secundaria <br> Respuesta correcta: B) 1B - 2A.', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordene los pasos para elaborar un organizador gráfico: <br> Elegir el tipo de organizador <br> Identificar ideas principales y secundarias <br> Completar con palabras clave <br> Interpretar relaciones', options: ['2-1-3-4', '1-2-3-4', '3-2-1-4', '4-3-2-1'], answer: '2-1-3-4', explanation: 'A) 2-1-3-4 <br> Explicación: Primero se identifican las ideas, luego se elige el tipo de organizador, se completa y se interpretan las relaciones.', multi: 'OFF', maxSelect: 1 },
            { question: 'Texto: “El cambio climático afecta los polos: el hielo se derrite, la fauna polar migra y el nivel del mar sube.” <br> ¿Qué idea secundaria se menciona?', options: ['El cambio climático es un problema global.', 'La fauna polar migra.', 'Los polos se enfrían.', 'El nivel del mar baja.'], answer: 'La fauna polar migra.', explanation: 'B) La fauna polar migra. <br> Explicación: Es un detalle concreto que apoya la idea principal.', multi: 'OFF', maxSelect: 1 },
            { question: 'Organizadores gráficos <br> Texto: “Un diagrama de Venn muestra: <br> - Características de sociología: estudia sociedades industrializadas. <br> - Características de antropología: estudia sociedades no industrializadas. <br> - Intersección: ambas estudian la sociedad.” <br> ¿Qué muestra la intersección?', options: ['Diferencias entre disciplinas', 'Similitud entre disciplinas', 'Cronología de su desarrollo', 'Causas de su origen'], answer: 'Similitud entre disciplinas', explanation: 'B) Similitud entre disciplinas <br> Explicación: La intersección muestra lo que tienen en común.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Qué pregunta ayuda a identificar la idea principal?', options: ['¿Cuántas palabras tiene el texto?', '¿De qué trata el texto en una frase?', '¿Quién es el autor?', '¿Cuándo se publicó?'], answer: '¿De qué trata el texto en una frase?', explanation: 'B) ¿De qué trata el texto en una frase?.', multi: 'OFF', maxSelect: 1 },

            { question: 'Ideas principales y secundarias. <br> Selecciona la opción que contiene las afirmaciones correctas. <br> Enunciados: <br> 1. La idea principal expresa la esencia del mensaje del autor. <br> 2. Las ideas secundarias complementan la idea principal con detalles. <br> 3. La idea principal siempre se encuentra al inicio del texto. <br> 4. Las ideas secundarias pueden suprimirse sin afectar el mensaje central. <br> 5. La idea principal depende de las ideas secundarias para su comprensión. <br> 6. Las ideas secundarias siempre incluyen ejemplos y fechas.', options: ['1, 2, 4', '2, 3, 5', '3, 4, 6', '1, 5, 6'], answer: '1, 2, 4', explanation: 'La idea principal es el mensaje central del texto y no depende de otras ideas; si se elimina, el texto pierde coherencia. Las ideas secundarias complementan con detalles, ejemplos o explicaciones, y pueden omitirse sin alterar el significado global. La idea principal no siempre está al inicio (puede estar implícita o al final), y las ideas secundarias no necesariamente incluyen fechas o ejemplos (pueden ser descripciones u otros datos). La idea principal es autónoma, mientras que las secundarias dependen de ella.', multi: 'OFF', maxSelect: 1 },
            { question: 'Organizadores gráficos. <br> Selecciona la opción que contiene las afirmaciones correctas. <br> 1. Los diagramas de Venn se usan para representar proporciones. <br> 2. Los mapas conceptuales muestran la jerarquía entre ideas. <br> 3. Los diagramas de flujo se utilizan para secuenciar eventos en el tiempo. <br> 4. Las líneas de tiempo ayudan a entender la cronología de eventos. <br> 5. Los organizadores gráficos no mejoran la memoria. <br> 6. Las tablas son útiles para comparar valores exactos.', options: ['1, 3, 5', '2, 4, 6', '1, 2, 3', '4, 5, 6'], answer: '2, 4, 6', explanation: 'Los mapas conceptuales representan relaciones jerárquicas entre conceptos, las líneas de tiempo ordenan eventos cronológicamente, y las tablas permiten comparar datos de manera precisa. Los diagramas de Venn se usan para comparar y contrastar elementos, no para proporciones (para eso sirven los gráficos circulares). Los diagramas de flujo ilustran procesos o secuencias, pero no necesariamente eventos temporales. Los organizadores gráficos mejoran la memoria al facilitar la visualización y organización de la información.', multi: 'OFF', maxSelect: 1 },
            { question: 'Lectura de tablas y figuras. <br> Selecciona la opción que contiene las afirmaciones correctas. <br> Enunciados: <br> 1. El título de una tabla es innecesario para su interpretación. <br> 2. En un gráfico, los ejes horizontal y vertical representan variables. <br> 3. Los gráficos circulares se utilizan para comparar múltiples series de datos. <br> 4. Las notas al pie proporcionan información sobre la fuente de datos. <br> 5. La lectura interpretativa se limita a extraer datos explícitos. <br> 6. Identificar tendencias es parte de la lectura interpretativa.', options: ['1, 3, 5', '2, 4, 6', '1, 2, 3', '4, 5, 6'], answer: '2, 4, 6', explanation: 'En un gráfico, los ejes representan variables específicas (ejemplo: tiempo vs. cantidad). Las notas al pie aclaran detalles metodológicos, fuentes o símbolos. Identificar tendencias es una actividad interpretativa que implica analizar patrones. El título es esencial para comprender el propósito de una tabla o figura. Los gráficos circulares muestran proporciones de un todo, no múltiples series (para eso se usan gráficos de barras). La lectura interpretativa va más allá de los datos explícitos e incluye inferencias y relaciones contextuales.', multi: 'OFF', maxSelect: 1 },

        const trustedProviders = [
            'gmail.com','googlemail.com','hotmail.com','hotmail.es','hotmail.co.uk','outlook.com',
            'outlook.es','live.com','msn.com','yahoo.com','yahoo.es','icloud.com','me.com',
            'protonmail.com','proton.me','aol.com','zoho.com','gmx.com','mail.com'
        ];

        function isValidEmailFormat(email) {
            const re = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
            return re.test(email) && email.length <= 254 && !email.includes('..') && !email.startsWith('.') && !email.endsWith('.');
        }

        function analyzeEmail(email) {
            const lower = email.toLowerCase().trim();
            if (!lower) {
                return { valid: false, msg: 'Escribe un correo electrónico.' };
            }
            if (!isValidEmailFormat(lower)) {
                return { valid: false, msg: 'Formato inválido. Revisa que tenga @ y un dominio correcto.' };
            }
            const domain = lower.split('@')[1];
            if (!domain || domain.length < 3) {
                return { valid: false, msg: 'Dominio incompleto o inválido.' };
            }
            if (disposableDomains.some(d => domain === d || domain.endsWith('.' + d))) {
                return { valid: false, msg: 'Correo temporal / desechable detectado. Usa un correo real.' };
            }
            const isTrusted = trustedProviders.some(p => domain === p);
            const hasGoodTld = /\.(com|es|net|org|edu|gov|mx|ar|co|uk|de|fr|it|pt|br|cl)$/i.test(domain);
            if (!hasGoodTld && !isTrusted) {
                return { valid: false, msg: 'Dominio poco común o sospechoso. Usa Gmail, Hotmail/Outlook, Yahoo, etc.' };
            }
            let analysisText = '';
            if (domain.includes('hotmail') || domain.includes('outlook') || domain.includes('live.com') || domain.includes('msn.com')) {
                analysisText = 'Análisis: proveedor Microsoft (Hotmail/Outlook) detectado · formato correcto · dominio legítimo';
            } else if (domain.includes('gmail') || domain.includes('googlemail')) {
                analysisText = 'Análisis: proveedor Google (Gmail) detectado · formato correcto · dominio legítimo';
            } else if (isTrusted) {
                analysisText = 'Análisis: proveedor conocido · formato correcto · dominio legítimo';
            } else {
                analysisText = 'Análisis: formato válido · dominio con TLD estándar · no se detectaron patrones de correo temporal';
            }
            return { valid: true, msg: analysisText };
        }

        function showSection(section, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const app = document.getElementById('app');
            if (section === 'pdf') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">📄 Pizarra Virtual</h2><div class="iframe-container"><iframe src="${DRIVE_PDF_URL}" width="100%" height="100%"></iframe></div></div>`;
            } else if (section === 'video') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">🎥 Video Clase</h2><div class="iframe-container"><iframe src="${DRIVE_VIDEO_URL}" width="100%" height="100%"></iframe></div></div>`;
            }
        }

        function prepQuiz(mode, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            state = {
                currentMode: mode,
                view: 'quiz_home',
                studentName: '',
                studentEmail: '',
                activeQuestions: [],
                currentQuestion: 0,
                score: 0,
                selectedAnswer: null,
                isAnswerCorrect: null,
                emailStatus: null,
                emailAnalysis: null,
                emailAnalysisMsg: ''
            };
            render();
        }

        function startQuiz() {
            if (state.currentMode === 'deber') {
                state.activeQuestions = [...quizData];
            } else if (state.currentMode === 'evaluacion') {
                state.activeQuestions = [...quizData]
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 20);
            } else if (state.currentMode === 'extra') {
                state.activeQuestions = [...quizDataExtra];
            }
            state.view = 'name_input';
            state.emailAnalysis = null;
            state.emailAnalysisMsg = '';
            render();
        }

        function onEmailInput() {
            const e = document.getElementById('email-in');
            if (!e) return;
            const val = e.value.trim();
            if (val.length < 5) {
                state.emailAnalysis = null;
                state.emailAnalysisMsg = '';
                updateEmailUI();
                return;
            }
            state.emailAnalysis = 'checking';
            state.emailAnalysisMsg = 'Analizando correo…';
            updateEmailUI();
            clearTimeout(window._emailCheckTimer);
            window._emailCheckTimer = setTimeout(() => {
                const result = analyzeEmail(val);
                state.emailAnalysis = result.valid ? 'valid' : 'invalid';
                state.emailAnalysisMsg = result.msg;
                updateEmailUI();
            }, 600);
        }

        function updateEmailUI() {
            const feedback = document.getElementById('email-feedback');
            const analysis = document.getElementById('email-analysis');
            const input = document.getElementById('email-in');
            if (!feedback || !analysis || !input) return;
            if (state.emailAnalysis === 'checking') {
                feedback.innerHTML = `<span class="text-slate-500 text-sm flex items-center gap-2"><span class="dot-pulse">●</span> Verificando…</span>`;
                analysis.innerHTML = `<p class="text-xs text-slate-400 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            } else if (state.emailAnalysis === 'invalid') {
                feedback.innerHTML = `<span class="text-red-600 text-sm font-semibold">✗ Correo no válido o inexistente</span>`;
                analysis.innerHTML = `<p class="text-xs text-red-500/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-emerald-400', 'border-slate-300');
                input.classList.add('border-red-400');
            } else if (state.emailAnalysis === 'valid') {
                feedback.innerHTML = `<span class="text-emerald-600 text-sm font-semibold">✓ Correo aceptado</span>`;
                analysis.innerHTML = `<p class="text-xs text-emerald-600/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-slate-300');
                input.classList.add('border-emerald-400');
            } else {
                feedback.innerHTML = '';
                analysis.innerHTML = '';
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            }
        }

        function validaDatos() {
            const n = document.getElementById('name-in').value.trim();
            const e = document.getElementById('email-in').value.trim();
            if (n.length <= 2) {
                alert("Ingresa nombre completo (mínimo 3 caracteres).");
                return;
            }
            const result = analyzeEmail(e);
            state.emailAnalysis = result.valid ? 'valid' : 'invalid';
            state.emailAnalysisMsg = result.msg;
            updateEmailUI();
            if (!result.valid) return;
            state.studentName = n;
            state.studentEmail = e;
            state.view = 'playing';
            render();
        }

        // ---------- LÓGICA DE RESPUESTAS (single + multi) ----------
        function isMultiQuestion(q) {
            return q.multi === 'ON';
        }

        function arraysEqual(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b)) return false;
            if (a.length !== b.length) return false;
            const sa = [...a].sort();
            const sb = [...b].sort();
            return sa.every((v, i) => v === sb[i]);
        }

        function handleAnswer(option) {
            // Ya se comprobó la respuesta → no permitir más cambios
            if (state.isAnswerCorrect !== null) return;

            const currentQ = state.activeQuestions[state.currentQuestion];

            if (isMultiQuestion(currentQ)) {
                // Selección múltiple: toggle
                let selected = Array.isArray(state.selectedAnswer) ? [...state.selectedAnswer] : [];
                const idx = selected.indexOf(option);

                if (idx > -1) {
                    selected.splice(idx, 1); // deseleccionar
                } else {
                    if (selected.length >= currentQ.maxSelect) return; // límite alcanzado
                    selected.push(option);
                }
                state.selectedAnswer = selected;
                render();
            } else {
                // Selección simple (incluye preguntas V/F)
                if (state.selectedAnswer !== null) return;
                state.selectedAnswer = option;
                state.isAnswerCorrect = (option === currentQ.answer);
                if (state.isAnswerCorrect) state.score++;
                render();
                if (state.isAnswerCorrect) {
                    setTimeout(() => nextQuestion(), 1000);
                }
            }
        }

        function checkMultiAnswer() {
            if (state.isAnswerCorrect !== null) return;

            const currentQ = state.activeQuestions[state.currentQuestion];
            if (!isMultiQuestion(currentQ)) return;

            const selected = Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [];
            if (selected.length === 0) return;

            // Comparación exacta (mismo conjunto de respuestas)
            const correctAnswers = Array.isArray(currentQ.answer) ? currentQ.answer : [currentQ.answer];
            state.isAnswerCorrect = arraysEqual(selected, correctAnswers);

            if (state.isAnswerCorrect) state.score++;
            render();

            if (state.isAnswerCorrect) {
                setTimeout(() => nextQuestion(), 1000);
            }
        }

        function nextQuestion() {
            if (state.currentQuestion + 1 < state.activeQuestions.length) {
                state.currentQuestion++;
                state.selectedAnswer = null;
                state.isAnswerCorrect = null;
                render();
            } else {
                state.view = 'results';
                render();
                enviarCorreo();
            }
        }

        function enviarCorreo() {
            if (!state.studentEmail) return;
            state.emailStatus = 'sending';
            render();
            const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
            const totalQ = state.activeQuestions.length;
            let imageUrl = '';
            let mensaje = '';
            if (scorePerc >= 90) {
                imageUrl = 'https://img.icons8.com/color/128/medal2.png';
                mensaje = `¡Excelente trabajo, ${state.studentName}! Obtuviste un resultado sobresaliente.`;
            } else if (scorePerc >= 70) {
                imageUrl = 'https://img.icons8.com/color/128/diploma.png';
                mensaje = `¡Muy bien, ${state.studentName}! Has aprobado con un buen resultado.`;
            } else if (scorePerc >= 50) {
                imageUrl = 'https://img.icons8.com/color/128/ok.png';
                mensaje = `Buen esfuerzo, ${state.studentName}. Sigue practicando para mejorar.`;
            } else {
                imageUrl = 'https://img.icons8.com/color/128/error.png';
                mensaje = `Ánimo, ${state.studentName}. Revisa el material y vuelve a intentarlo.`;
            }
            const params = {
                to_name: state.studentName,
                to_email: state.studentEmail,
                score: scorePerc,
                correct_answers: state.score,
                total_questions: totalQ,
                mode_name: state.currentMode.toUpperCase(),
                image_url: imageUrl,
                mensaje: mensaje,
                fecha: new Date().toLocaleDateString('es-ES', { 
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                })
            };
            emailjs.send("service_dhvsi72", "template_cy74x9h", params)
                .then(() => { 
                    state.emailStatus = 'success'; 
                    render(); 
                })
                .catch((err) => { 
                    console.error('Error EmailJS:', err);
                    state.emailStatus = 'error'; 
                    render(); 
                });
        }

        function render() {
            const app = document.getElementById('app');
            
            let modeTitle = '';
            let modeDesc = '';
            if (state.currentMode === 'deber') {
                modeTitle = '📚 Practica';
                modeDesc = 'Resuelve las 50 preguntas del banco en orden.';
            } else if (state.currentMode === 'evaluacion') {
                modeTitle = '📝 Repaso';
                modeDesc = 'Prueba de 20 preguntas seleccionadas al azar.';
            } else if (state.currentMode === 'extra') {
                modeTitle = '📊 Evaluación';
                modeDesc = 'Resuelve las 16 preguntas de la Evaluación.';
            }
            
            if (state.view === 'quiz_home') {
                app.innerHTML = `
                <div class="text-center py-16 animate-fade-in bg-white rounded-[3rem] shadow-xl border">
                    <h2 class="text-4xl font-black text-slate-800 mb-2">${modeTitle}</h2>
                    <p class="text-slate-500 mb-8 text-lg">${modeDesc}</p>
                    <button onclick="startQuiz()" class="bg-emerald-600 text-white px-12 py-5 rounded-2xl font-black text-xl hover:bg-emerald-700 transition-all">
                        INICIAR
                    </button>
                </div>`;
            }

            if (state.view === 'name_input') {
                app.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-10 rounded-[2.5rem] shadow-2xl animate-fade-in">
                    <h2 class="text-2xl font-black mb-6 text-center">Registro de Estudiante</h2>
                    <input id="name-in" type="text" placeholder="Nombre y Apellido completo" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-4 focus:border-emerald-500 outline-none">
                    
                    <div class="relative mb-1">
                        <input id="email-in" type="email" placeholder="Correo para recibir nota (Gmail, Hotmail…)" 
                               class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl focus:border-emerald-500 outline-none transition-colors"
                               oninput="onEmailInput()" onblur="onEmailInput()">
                    </div>
                    
                    <div id="email-feedback" class="min-h-[22px] mb-1"></div>
                    <div id="email-analysis" class="mb-5"></div>
                    
                    <button onclick="validaDatos()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-all">
                        ENTRAR AL TEST
                    </button>
                    <p class="text-center text-[11px] text-slate-400 mt-4">Se verifica formato y se descartan correos temporales. No se envía nada hasta terminar el test.</p>
                </div>`;
                setTimeout(updateEmailUI, 50);
            }

            if (state.view === 'playing') {
                const q = state.activeQuestions[state.currentQuestion];
                const progress = ((state.currentQuestion + 1) / state.activeQuestions.length) * 100;
                const multi = isMultiQuestion(q);
                const selected = multi
                    ? (Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [])
                    : (state.selectedAnswer ? [state.selectedAnswer] : []);

                // Indicador de selección múltiple (CORREGIDO)
                const multiHint = multi
                    ? `<p class="text-sm text-sky-600 font-semibold mb-4">
                         Selección múltiple · elige q.maxSelectrespuesta{q.maxSelect > 1 ? 's' : ''}
                         ${selected.length > 0 ? `(${selected.length}/${q.maxSelect})` : ''}
                       </p>`
                    : '';

                app.innerHTML = `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-6 px-4">
                        <span class="font-black text-emerald-600">${state.currentQuestion + 1} / ${state.activeQuestions.length}</span>
                        <div class="w-48 bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all" style="width:${progress}%"></div>
                        </div>
                    </div>
                    <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 leading-tight">${q.question}</h2>
                        ${multiHint}
                        <div class="grid gap-3">
                            ${q.options.map(opt => {
                                let style = "border-slate-100 bg-slate-50 hover:border-emerald-200";
                                const isSelected = selected.includes(opt);

                                if (state.isAnswerCorrect !== null) {
                                    // Ya se comprobó → mostrar feedback final
                                    if (multi) {
                                        const correctSet = Array.isArray(q.answer) ? q.answer : [q.answer];
                                        if (correctSet.includes(opt) && isSelected) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected && !correctSet.includes(opt)) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        } else if (correctSet.includes(opt) && !isSelected) {
                                            style = "border-emerald-300 bg-emerald-50 text-emerald-700";
                                        }
                                    } else {
                                        // Selección simple (incluye V/F) - muestra la correcta en verde
                                        if (opt === q.answer) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        }
                                    }
                                } else if (isSelected) {
                                    // Selección en curso
                                    if (multi) {
                                        style = "border-sky-400 bg-sky-100 text-sky-800";
                                    } else {
                                        style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                    }
                                }

                                // Escapar comillas y barras para el atributo onclick
                                const safeOpt = opt.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

                                return `<button onclick="handleAnswer('${safeOpt}')" 
                                            class="p-5 text-left border-2 rounded-xl font-bold transition-all ${style}">
                                            ${opt}
                                        </button>`;
                            }).join('')}
                        </div>

                        ${/* Botón comprobar (solo multi y aún no comprobado) - CORREGIDO */
                          multi && state.isAnswerCorrect === null ? `
                            <button onclick="checkMultiAnswer()" 
                                class="mt-6 w-full py-4 rounded-xl font-bold transition-all
                                ${selected.length === q.maxSelect 
                                    ? 'bg-sky-600 text-white hover:bg-sky-700' 
                                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                                ${selected.length !== q.maxSelect ? 'disabled' : ''}>
                                Comprobar respuesta (selected.length/{q.maxSelect})
                            </button>
                          ` : ''}

                        ${/* Explicación + siguiente (cuando falló) */
                          state.selectedAnswer !== null && state.isAnswerCorrect === false ? `
                            <div class="mt-6 p-5 bg-amber-50 border border-amber-200 rounded-xl">
                                <p class="font-bold text-amber-800 mb-2">Explicación:</p>
                                <p class="text-slate-700">${q.explanation}</p>
                            </div>
                            <button onclick="nextQuestion()" class="mt-6 w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all">
                                Siguiente pregunta
                            </button>
                          ` : ''}
                    </div>
                </div>`;
            }

            if (state.view === 'results') {
                const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
                app.innerHTML = `
                <div class="max-w-md mx-auto text-center animate-fade-in bg-white p-12 rounded-[3rem] shadow-2xl">
                    <h2 class="text-2xl font-black mb-2">${state.studentName}</h2>
                    <p class="text-slate-400 uppercase text-xs font-bold mb-6">${state.currentMode}</p>
                    <div class="text-7xl font-black text-emerald-600 mb-4">${scorePerc}%</div>
                    <p class="text-lg font-bold text-slate-700 mb-10">${state.score} / ${state.activeQuestions.length} correctas</p>
                    <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">VOLVER AL INICIO</button> 
                    <p class="mt-6 text-xs font-bold text-slate-400"> 
                        ${state.emailStatus === 'success' ? '✅ Nota e imagen enviadas al correo' : 
                          state.emailStatus === 'error' ? '⚠️ Error al enviar nota e imagen' : 
                          '⏳ Enviando nota e imagen al correo...'}
                    </p>
                </div>`;
            }
        }
        render();
    </script>
</body>
</html>
